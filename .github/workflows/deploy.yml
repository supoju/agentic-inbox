name: Deploy to Cloudflare Worker

# Deployment is intentionally manual. Validate the branch and configuration first.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Probe existing Worker metadata access (HTTP statuses only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          check() {
            local status
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}${2}")
            printf '%s: HTTP %s\\n' "${1}" "${status}"
          }
          check bindings '/workers/services/agentic-inbox-test/environments/production/bindings'
          check routes '/workers/services/agentic-inbox-test/environments/production/routes?show_zonename=true'
          check custom_domains '/workers/domains/records?page=0&per_page=5&service=agentic-inbox-test&environment=production'
          check subdomain '/workers/services/agentic-inbox-test/environments/production/subdomain'
          check service '/workers/services/agentic-inbox-test/environments/production'
          check schedules '/workers/scripts/agentic-inbox-test/schedules'

      - name: Install dependencies
        run: npm ci

      # Wrangler 4.74 predates Cloudflare's per-Worker API-token roles.
      # Install the trial CLI outside the project's dependency tree to avoid
      # changing the application lockfile or its Workers types.
      - name: Install current Wrangler for isolated deployment trial
        run: npm install --prefix "$RUNNER_TEMP/agentic-wrangler" --no-save --package-lock=false wrangler@4.156.0

      - name: Deploy to Cloudflare
        run: npm run build && "$RUNNER_TEMP/agentic-wrangler/node_modules/.bin/wrangler" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
