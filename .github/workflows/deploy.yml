name: Deploy to Cloudflare Worker

# Deployment is intentionally manual. Validate the branch and configuration first.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Wrangler 4.74 predates Cloudflare's per-Worker API-token roles.
      # Install the trial CLI outside the project's dependency tree to avoid
      # changing the application lockfile or its Workers types.
      - name: Install current Wrangler for isolated deployment trial
        run: npm install --prefix "$RUNNER_TEMP/agentic-wrangler" --no-save --package-lock=false wrangler@4.156.0

      - name: Deploy to Cloudflare
        run: npm run build && "$RUNNER_TEMP/agentic-wrangler/node_modules/.bin/wrangler" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
