name: Evaluate Security00 Upstream on Workers Free

on:
  push:
    branches:
      - test/security00-upstream-free-20261101
    paths:
      - wrangler.jsonc
      - .github/workflows/upstream-free-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-isolated:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout isolated upstream evaluation branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Build upstream application
        run: npm run build
      - name: Install Wrangler in a separate directory
        run: npm install --prefix "$RUNNER_TEMP/upstream-wrangler" --no-save --package-lock=false wrangler@4.156.0
      - name: Deploy isolated Worker without inbox.zecview.com route
        run: |
          "$RUNNER_TEMP/upstream-wrangler/node_modules/.bin/wrangler" deploy
